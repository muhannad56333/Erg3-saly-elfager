h1{text-align:center;font-size:26px;margin:8px 0 2px;color:#fff;text-shadow:0 2px 8px rgba(0,40,80,.55)}
.sub{text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,40,80,.6);margin:0 0 16px;font-size:14px}
.card{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);font-weight:600;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.lvl{text-align:center}
.big{font-size:54px;line-height:1}
.lname{font-size:22px;font-weight:700;margin:6px 0}
.bar{height:14px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
.mut{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px}
.don{font-size:22px;line-height:1.5;text-align:center;word-break:break-all;min-height:34px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-size:16px;margin-bottom:10px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.lnk{background:var(--card);color:var(--mut);font-size:13px;font-weight:400;padding:8px;width:auto;display:block;margin:0 auto}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--bd);font-size:14px}
li:last-child{border:0}
#msg{text-align:center;font-weight:700;min-height:24px;margin-top:10px;color:var(--ac)}
.lv{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.lv.on{color:var(--ac);font-weight:700}.lv.off{opacity:.45}
#ins{display:block;margin-bottom:14px;text-align:center}
#ins button{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#101010}
#ins .ai{display:block;width:84px;height:84px;margin:0 auto 10px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#ins .ios{font-size:14px;line-height:1.7;text-align:center}
</style>

<button id="ib" type="button">📲 حمّل التطبيق على موبايلك</button>
<div class="ios mut" id="ih" style="display:none"></div>
</div>
<div class="card lvl">
<div class="big" id="ic">😴</div>
<div class="lname" id="ln"></div>
<div class="bar"><i id="pb"></i></div>
<div class="mut" id="pt"></div>
</div>

<div class="card" id="pz" style="text-align:center"></div>
<div class="card stats">
<div><b id="sc">0</b><span class="mut">فجر</span></div>
<div><b id="sd">1</b><span class="mut">المستوى</span></div>
</div>


<div class="card">
<div id="st" style="text-align:center;font-weight:700;margin-bottom:10px"></div>
<input id="mq" placeholder="اسم الجامع اللي صليت فيه" maxlength="60">
<button id="go">صليت الفجر ✅</button>
<div id="msg"></div>
</div>

<div class="card"><b>المستويات</b><div id="lvs" style="margin-top:8px"></div></div>
<div class="card"><b>سجل الفجر</b><ul id="hs" style="margin-top:8px"></ul></div>
<button class="lnk" id="rs">مسح كل البيانات</button>
</div>

<script>
const LV=[[0,"😴","نايم متمسك"],[1,"⏰","صحيت بالعافية"],[3,"🌤️","صاحي بدري"],[7,"🕌","مواظب"],[15,"🌙","ملتزم"],[30,"⭐","من أهل الفجر"],[50,"🦅","فارس الفجر"],[75,"👑","نجم المسجد"],[100,"🔥","أسطورة الفجر"],[200,"💎","سلطان الفجر"]];
const PRIZE="جايزة مفاجأة";
const K="fajr-levels-v1";
let S={logs:[],donuts:0};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const $=id=>document.getElementById(id);
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const lvlOf=n=>{let i=0;LV.forEach((l,k)=>{if(n>=l[0])i=k});return i};
function streak(){
  const set=new Set(S.logs.map(l=>l.d));let d=new Date(),c=0;
  if(!set.has(dkey(d)))d.setDate(d.getDate()-1);
  while(set.has(dkey(d))){c++;d.setDate(d.getDate()-1)}
  return c;
}
const pos=()=>[30.4167,31.5667,19.5];
function fajrAt(dt){const [lat,lng,ang]=pos(),R=Math.PI/180;
 const D=(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate(),12)-Date.UTC(2000,0,1,12))/864e5;
 const g=((357.529+0.98560028*D)%360)*R,q=(280.459+0.98564736*D)%360;
 const L=(q+1.915*Math.sin(g)+0.02*Math.sin(2*g))*R,e=(23.439-3.6e-7*D)*R;
 const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15;
 let eq=q/15-ra;eq=((eq+12)%24+24)%24-12;
 const dec=Math.asin(Math.sin(e)*Math.sin(L));
 const ch=(-Math.sin(ang*R)-Math.sin(lat*R)*Math.sin(dec))/(Math.cos(lat*R)*Math.cos(dec));
 const H=Math.acos(Math.max(-1,Math.min(1,ch)))/R/15;
 return new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())+(12-lng/15-eq-H)*36e5);}
function win(){const n=new Date(),f=fajrAt(n),e=new Date(f.getTime()+36e5);return{f,e,state:n<f?"before":n<=e?"open":"after"}}
const tf=d=>d.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"});
function render(){
  const n=S.logs.length,i=lvlOf(n),cur=LV[i],nx=LV[i+1];
  $("ic").textContent=cur[1];
  $("ln").textContent="المستوى "+(i+1)+" – "+cur[2];
  if(nx){$("pb").style.width=((n-cur[0])/(nx[0]-cur[0])*100)+"%";$("pt").textContent="باقي "+(nx[0]-n)+" فجر للمستوى الجاي: "+nx[2]}
  else{$("pb").style.width="100%";$("pt").textContent="وصلت لأعلى مستوى 🎉"}
  $("sc").textContent=n;$("sd").textContent=i+1;
  const T=LV[LV.length-1][0];
  if(n>=T){if(!S.win){S.win=new Date().toLocaleString("ar-EG");save()}
   $("pz").innerHTML='<div class="big">🏆</div><div class="lname">مبروك! خلصت كل المستويات</div><div>جايزتك: '+PRIZE+' 🎁</div><div class="mut" style="margin-top:8px">وقت الإنجاز: '+S.win+'<br>صوّر الشاشة دي وابعتها عشان تستلم جايزتك</div>'}
  else $("pz").innerHTML='<b>🎁 جايزة أول واحد يخلص كل المستويات</b><div style="margin:4px 0">'+PRIZE+'</div><div class="mut">باقي '+(T-n)+' فجر على سلطان الفجر</div>';
    $("lvs").innerHTML=LV.map((l,k)=>'<div class="lv '+(k===i?"on":k>i?"off":"")+'"><span>'+l[1]+" "+(k+1)+" – "+l[2]+'</span><span>'+l[0]+" فجر</span></div>").join("");
  $("hs").innerHTML=S.logs.length?S.logs.slice().reverse().slice(0,30).map(l=>"<li><span>🕌 "+l.m.replace(/</g,"&lt;")+"</span><span class='mut'>"+l.d+"</span></li>").join(""):"<li class='mut'>مفيش تسجيلات لسه</li>";
  const done=S.logs.some(l=>l.d===dkey(new Date()));
  const w=win();
  $("go").disabled=done;
  $("go").textContent=done?"سجلت فجر النهارده ✅":"صليت الفجر ✅";
  $("st").textContent=w.state==="before"?"أذان الفجر النهارده "+tf(w.f)+" – التسجيل بيفتح وقتها":w.state==="open"?"التسجيل مفتوح من "+tf(w.f)+" لحد "+tf(w.e)+" 🌅":"التسجيل قفل (كان من "+tf(w.f)+" لحد "+tf(w.e)+") – ألقاك بكرة بدري";
}
$("go").onclick=()=>{
  const w=win();if(w.state!=="open"){const g=$("msg");g.style.color="#e5483b";g.textContent=w.state==="before"?"⚠️ لسه الفجر مجاش! الأذان الساعة "+tf(w.f):"⚠️ وقت التسجيل خلص، الفجر عدّى بقاله أكتر من ساعة";return}
  $("msg").style.color="";
  const m=$("mq").value.trim();
  if(!m){$("msg").textContent="اكتب اسم الجامع الأول 🕌";return}
  const before=lvlOf(S.logs.length);
  S.logs.push({d:dkey(new Date()),m});
  const up=lvlOf(S.logs.length)>before;save();$("mq").value="";
  $("msg").textContent=up?"🎉 مستوى جديد! تقبل الله":"تقبل الله 🤲";
  render();
};
$("rs").onclick=()=>{if(confirm("متأكد إنك عايز تمسح كل حاجة؟")){S={logs:[],donuts:0};save();render();$("msg").textContent=""}};
render();setInterval(render,30000);

/* ===== تثبيت التطبيق (PWA) ===== */
(function(){
  const box=$("ins"),btn=$("ib"),hint=$("ih");
  const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const secure=/^https?:$/.test(location.protocol);
  if("serviceWorker" in navigator&&secure){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
  if(standalone()){box.style.display="none";return}
  let ev=null;
  const info=()=>{
    hint.style.display="";
    if(!secure)hint.innerHTML="⚠️ الملف مفتوح من الجهاز مباشرة. لازم ترفع الموقع على استضافة (رابط https) وتفتحه من الرابط علشان التحميل يشتغل.";
    else if(ios)hint.innerHTML="📲 على الآيفون (من سفاري): اضغط زر المشاركة <b>⬆️</b> ثم <b>«إضافة إلى الشاشة الرئيسية»</b>";
    else hint.innerHTML="📲 افتح قائمة المتصفح <b>⋮</b> واختار <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.<br>لو مش ظاهرة افتح الرابط من كروم، وتأكد إنك مش فاتحه من جوه تطبيق تاني.";
  };
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;hint.style.display="none"});
  btn.onclick=async()=>{
    if(ev){ev.prompt();try{await ev.userChoice}catch(e){}ev=null;return}
    info();
  };
  addEventListener("appinstalled",()=>{box.style.display="none"});
})();
</script>
</body>
